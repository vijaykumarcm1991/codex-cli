[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-agent-cli"
version = "0.3.0"
description = "A modern terminal coding agent for OpenAI-compatible APIs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
oac = "oac.cli:main"

[tool.setuptools.packages.find]
include = ["oac*"]
